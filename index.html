<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Signal Board</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C5F8A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal Board">
<style>
:root{--surface-1:#faf9f5;--surface-2:#fff;--bg-neutral:#eeece4;--bg-accent:#dbe8f7;--bg-warning:#faeeda;--bg-danger:#fcebeb;--bg-success:#eaf3de;--text-primary:#141413;--text-secondary:#5e5d59;--text-muted:#8a887f;--text-accent:#185fa5;--text-warning:#854f0b;--text-danger:#a32d2d;--text-success:#3b6d11;--border:rgba(20,20,19,.14);--border-strong:rgba(20,20,19,.28);--border-stronger:rgba(20,20,19,.45);--border-accent:#85b7eb;--radius:8px;--font-mono:ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--surface-1:#1f1e1d;--surface-2:#2b2a28;--bg-neutral:#3a3936;--bg-accent:#1c3550;--bg-warning:#4a3512;--bg-danger:#4a1f1f;--bg-success:#25391a;--text-primary:#f0eee6;--text-secondary:#b5b3aa;--text-muted:#85837b;--text-accent:#85b7eb;--text-warning:#efb35c;--text-danger:#f09595;--text-success:#97c459;--border:rgba(240,238,230,.16);--border-strong:rgba(240,238,230,.3);--border-stronger:rgba(240,238,230,.5);--border-accent:#378add}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-1);color:var(--text-primary);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
button,select,input[type=text],input[type=date]{font:inherit;font-size:13px;color:var(--text-primary);background:transparent;border:.5px solid var(--border-strong);border-radius:var(--radius);height:34px;padding:0 10px}
input[type=text],input[type=date]{background:var(--surface-2)}
button{cursor:pointer}button:hover{background:var(--bg-neutral)}
input[type=checkbox]{width:16px;height:16px}
.sb .seg{display:flex;gap:4px;margin-bottom:12px;align-items:center}
.sb .seg button.on,.sb .on.sm{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.sb .sm{height:28px;font-size:12px;padding:0 10px}
.sb .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}
.sb .chip{height:28px;padding:0 10px;border-radius:14px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.sb .chip.on{background:var(--bg-neutral);border-color:var(--border-stronger);font-weight:500}
.sb .chip.fl.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.sb .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sb .scroll{overflow-x:auto}
.sb .ti{border-top:.5px solid var(--border);min-width:860px}
.sb .ti:first-child{border-top:none}
.sb .row{display:grid;align-items:center;gap:8px;padding:8px 10px}
.sb .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .ttl{min-width:0}
.sb .ttl>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .ttl>span:focus{white-space:normal;outline:1px solid var(--border-accent);border-radius:4px;padding:0 3px}
.sb .note{font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .mut{color:var(--text-secondary);font-size:12px}
.sb .tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg-neutral);color:var(--text-secondary);white-space:nowrap}
.sb .st{height:26px;font-size:12px;padding:0 6px;border-radius:13px;border:none}
.sb .ow{height:26px;font-size:12px;padding:0 4px;max-width:100%}
.sb .du{height:26px;font-size:12px;padding:0 4px;width:100%}
.sb .pb{height:24px;font-size:11px;padding:0 8px;border-radius:12px}
.sb .pb.High{background:var(--bg-danger);color:var(--text-danger);border-color:transparent}
.sb .pb.Medium{background:var(--bg-warning);color:var(--text-warning);border-color:transparent}
.sb .pb.Low{background:var(--bg-accent);color:var(--text-accent);border-color:transparent}
.sb .xs{height:24px;font-size:11px;padding:0 7px}
.sb .card{background:var(--surface-2);border:.5px solid var(--border);border-radius:12px;overflow:hidden}
.sb .m{background:var(--bg-neutral);border-radius:var(--radius);padding:12px}
.sb .m b{display:block;font-size:22px;font-weight:500}
.sb .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sb .bar{height:8px;border-radius:4px;background:var(--bg-neutral);overflow:hidden}
.sb .bar i{display:block;height:100%}
.sb pre{white-space:pre-wrap;font-family:var(--font-mono);font-size:12px;background:var(--bg-neutral);border-radius:var(--radius);padding:12px;margin:8px 0;line-height:1.55}
.sb .s-backlog{background:var(--bg-neutral);color:var(--text-secondary)}
.sb .s-progress{background:var(--bg-warning);color:var(--text-warning)}
.sb .s-blocked{background:var(--bg-danger);color:var(--text-danger)}
.sb .s-done{background:var(--bg-success);color:var(--text-success)}
.sb .hint{font-size:12px;color:var(--text-muted);margin:6px 0 0}
.sb .pv{font-size:12px;color:var(--text-accent);min-height:18px;margin:6px 0 0}
.sb .set{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.sb .subs{padding:4px 10px 10px 40px;background:var(--bg-neutral)}
.sb .subs .sr{display:flex;align-items:center;gap:8px;padding:3px 0}
.sb .subs .sr span{flex:1}
.sb .subs .sr .dn{text-decoration:line-through;color:var(--text-muted)}
.sb .cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;align-items:start}
.sb .col{background:var(--bg-neutral);border-radius:12px;padding:8px;min-height:120px}
.sb .col.over{outline:2px dashed var(--border-accent)}
.sb .col h4{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--text-secondary);display:flex;justify-content:space-between}
.sb .kc{background:var(--surface-2);border:.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;margin-bottom:6px;cursor:grab;font-size:13px}
.sb .kc .mut{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.sb kbd{font-family:var(--font-mono);font-size:11px;background:var(--bg-neutral);border:.5px solid var(--border-strong);border-radius:4px;padding:0 5px}
.sb .arow{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:.5px solid var(--border)}
.sb .arow:first-of-type{border-top:none}
@media(max-width:700px){.sb .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sb .cols{grid-auto-flow:row}}
</style></head><body><div class="wrap">
<div class="sb" id="app"></div></div>
<input type="file" id="ifile" accept=".json,application/json" hidden>
<script>
/* ====== CONFIG: edit this block to customize the board ====== */
const COLORS={Blue:'#378ADD',Teal:'#1D9E75',Amber:'#BA7517',Purple:'#7F77DD',Coral:'#D85A30',Pink:'#D4537E',Gray:'#888780',Green:'#639922'};
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const TODAY=todayStr();
const od=t=>t.due&&t.due<TODAY&&t.st!=='done';
const C={title:'Signal board',
cats:[{id:'mkt',n:'Marketing PDs',c:'#7F77DD'},{id:'ops',n:'Daily operations',c:'#BA7517'},{id:'gen',n:'General',c:'#378ADD'},{id:'prj',n:'Projects',c:'#1D9E75'},{id:'per',n:'Personal',c:'#D4537E'}],
sts:[{id:'backlog',n:'Backlog'},{id:'progress',n:'In progress'},{id:'blocked',n:'Blocked'},{id:'done',n:'Done'}],
pris:['High','Medium','Low'],
team:[],
filters:[{id:'od',n:'Overdue',f:t=>od(t)},{id:'blk',n:'Blocked',f:t=>t.st==='blocked'},{id:'wo',n:'WO tasks',f:t=>!!t.ref},{id:'hi',n:'High priority',f:t=>t.pri==='High'}],
cols:{ref:true,own:true,pri:true,due:true}};
/* ====== end of config ====== */
let T=[],ARCH=[];
const LK='signal-board-v2',OLDK='signal-board-state-v1';
let SV='Loading…',REF=null,MODE='',loaded=false,saveT=null,saving=false,again=false;
const uid=p=>(p||'t')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const addD=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const fd=d=>new Date(d+'T00:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const PAL=['#7F77DD','#BA7517','#378ADD','#1D9E75','#D4537E','#D85A30','#639922','#888780'],PMAP={high:'High',med:'Medium',low:'Low'};
function convertOld(o){const cats=(o.areas||[]).map((a,i)=>({id:a.id,n:a.name,c:PAL[i%PAL.length]}));
const tk=t=>({id:String(t.id),t:t.title||'',cat:t.area||(cats[0]&&cats[0].id)||'',st:t.status||'backlog',pri:PMAP[t.priority]||'',due:t.due||'',ref:'',own:t.assignee||'',note:t.notes||'',subs:(t.subtasks||[]).map(s=>({id:String(s.id),t:s.title||'',done:!!s.done}))});
return{cfg:{cats:cats,team:o.assignees||[]},tasks:(o.tasks||[]).map(tk),arch:(o.archivedTasks||[]).map(t=>Object.assign(tk(t),{at:t.archivedAt||'',catName:t.areaName||''}))}}
const norm=t=>Object.assign({id:uid(),t:'',cat:'',st:'backlog',pri:'',due:'',ref:'',own:'',note:'',subs:[]},t,{subs:Array.isArray(t.subs)?t.subs:[]});
function applyData(d){if(d&&Array.isArray(d.areas))d=convertOld(d);if(!d||!Array.isArray(d.tasks))return false;T=d.tasks.map(norm);ARCH=Array.isArray(d.arch)?d.arch.map(norm):[];const g=d.cfg||{};if(g.title)C.title=g.title;if(Array.isArray(g.cats)&&g.cats.length)C.cats=g.cats;if(Array.isArray(g.sts)&&g.sts.length)C.sts=g.sts;if(Array.isArray(g.team))C.team=g.team;if(g.cols)C.cols=Object.assign(C.cols,g.cols);return true}
function payload(){return{cfg:{title:C.title,cats:C.cats,sts:C.sts,cols:C.cols,team:C.team},tasks:T,arch:ARCH,rev:Date.now()}}
function setSV(m){SV=m;const e=document.getElementById('sv');if(e)e.textContent=m}
function unwrap(r){if(!r)return null;if(typeof r.exists==='boolean'&&!r.exists)return null;if(typeof r.data==='function')return r.data();if(r.data&&typeof r.data==='object'&&'tasks' in r.data)return r.data;return r}
function save(){if(!loaded)return;if(MODE==='local'){try{localStorage.setItem(LK,JSON.stringify(payload()));setSV('Saved on this device')}catch(e){setSV('Save failed')}return}
if(MODE!=='db')return;setSV('Saving…');clearTimeout(saveT);saveT=setTimeout(doSave,500)}
async function doSave(){if(saving){again=true;return}saving=true;try{await REF.set(payload());setSV('Saved')}catch(e){setSV('Save failed')}saving=false;if(again){again=false;save()}}
function commit(){save();draw()}
async function init(){let db=null;try{if(window.claude&&window.claude.use)db=await window.claude.use('db')}catch(e){}
if(db){try{REF=db.doc('board/main');const r=await Promise.race([REF.get(),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),10000))]);applyData(unwrap(r));MODE='db';loaded=true;setSV('Saved');draw()}catch(e){REF=null;setSV('Could not load: changes will not be saved')}return}
try{const raw=localStorage.getItem(LK);if(raw){applyData(JSON.parse(raw))}else{const old=localStorage.getItem(OLDK);if(old){applyData(JSON.parse(old));localStorage.setItem(LK,JSON.stringify(payload()))}}MODE='local';loaded=true;setSV('Saved on this device');draw()}catch(e){setSV('Not saving: storage is blocked')}}
/* ====== state ====== */
let V='tasks',LAY='list',TS='today',F={cat:'all',q:'',done:false,flt:'',own:''},OPEN={},ARCHOPEN=false;
const cat=id=>C.cats.find(c=>c.id===id)||{n:'?',c:'#888780'};
const WDF=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function pdate(k){const l=k.toLowerCase();if(l==='today')return TODAY;if(l==='tomorrow'||l==='tmrw')return addD(TODAY,1);const m=l.match(/^\+(\d+)([dw])$/);if(m)return addD(TODAY,+m[1]*(m[2]==='w'?7:1));let i=WDF.findIndex(w=>l===w||l===w.slice(0,3));if(i>=0){const cur=new Date(TODAY+'T00:00:00Z').getUTCDay();let n=(i-cur+7)%7;if(n===0)n=7;return addD(TODAY,n)}return ''}
function parseQ(raw){const t=norm({id:'',cat:F.cat==='all'?(C.cats[0]||{}).id:F.cat,st:C.sts[0].id});const w=[];raw.trim().split(/\s+/).filter(Boolean).forEach(k=>{const l=k.toLowerCase();let d;
if(l[0]==='#'){const c=C.cats.find(c=>l.length>1&&(c.id.startsWith(l.slice(1))||c.n.toLowerCase().startsWith(l.slice(1))));if(c)t.cat=c.id;else w.push(k)}
else if(/^p[1-3]$/.test(l))t.pri=C.pris[+l[1]-1];
else if(l.startsWith('wo:')&&l.length>3)t.ref='WO '+k.slice(3);
else if(l.startsWith('due:')&&l.length>4)t.due=k.slice(4);
else if(l[0]==='@'&&l.length>1)t.own=k.slice(1);
else if((d=pdate(k)))t.due=d;
else w.push(k)});t.t=w.join(' ');return t}
function scope(t){return TS==='all'?true:TS==='today'?(t.due&&t.due<=TODAY)||t.st==='progress':!!t.due&&t.due>TODAY}
function base(){const f=C.filters.find(x=>x.id===F.flt);return T.filter(t=>(F.cat==='all'||t.cat===F.cat)&&(!F.own||t.own===F.own)&&(!F.q||(t.t+t.ref+t.note).toLowerCase().includes(F.q.toLowerCase()))&&(!f||f.f(t)))}
function vis(){return base().filter(t=>scope(t)&&(F.done||t.st!=='done'))}
function cols(){let g=['22px','minmax(0,1fr)','64px'];if(C.cols.ref)g.push('72px');g.push('112px');if(C.cols.own)g.push('84px');if(C.cols.due)g.push('122px');if(C.cols.pri)g.push('72px');g.push('100px','64px');return g.join(' ')}
function subsH(t){return `<div class="subs">${t.subs.map(s=>`<div class="sr"><input type="checkbox" data-a="sc" data-id="${t.id}" data-s="${s.id}" ${s.done?'checked':''}><span class="${s.done?'dn':''}">${esc(s.t)}</span><button class="xs" data-a="sx" data-id="${t.id}" data-s="${s.id}" aria-label="Delete subtask">x</button></div>`).join('')}<input type="text" data-a="sa" data-id="${t.id}" placeholder="Add a subtask and press Enter" style="width:100%;margin-top:4px;height:30px"></div>`}
function rowH(t){const c=cat(t.cat),sd=t.subs.filter(s=>s.done).length,own=C.team.includes(t.own)||!t.own?C.team:C.team.concat([t.own]);
return `<div class="ti"><div class="row" style="grid-template-columns:${cols()}"><input type="checkbox" data-a="chk" data-id="${t.id}" ${t.st==='done'?'checked':''}><div class="ttl"><span contenteditable="true" data-a="et" data-id="${t.id}" style="${t.st==='done'?'text-decoration:line-through;color:var(--text-muted)':''}">${esc(t.t)}</span>${t.note?`<div class="note">${esc(t.note)}</div>`:''}</div><button class="xs" data-a="sb" data-id="${t.id}">${t.subs.length?'Sub '+sd+'/'+t.subs.length:'+ Sub'}</button>${C.cols.ref?`<span>${t.ref?`<span class="tag">${esc(t.ref)}</span>`:''}</span>`:''}<span class="mut t"><span class="dot" style="background:${c.c}"></span> ${esc(c.n)}</span>${C.cols.own?`<select class="ow" data-a="ow" data-id="${t.id}"><option value="">Unassigned</option>${own.map(n=>`<option ${n===t.own?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}${C.cols.due?`<input type="date" class="du" data-a="du" data-id="${t.id}" value="${esc(t.due)}" style="${od(t)?'color:var(--text-danger)':''}">`:''}${C.cols.pri?`<button class="pb ${t.pri}" data-a="pc" data-id="${t.id}" title="Click to change priority">${t.pri||'Priority'}</button>`:''}<select class="st s-${t.st}" data-a="st" data-id="${t.id}">${C.sts.map(s=>`<option value="${s.id}" ${s.id===t.st?'selected':''}>${esc(s.n)}</option>`).join('')}</select><span style="display:flex;gap:4px">${t.st==='done'?`<button class="xs" data-a="ar" data-id="${t.id}" title="Archive">Archive</button>`:''}<button class="xs" data-a="del" data-id="${t.id}" aria-label="Delete task">x</button></span></div>${OPEN[t.id]?subsH(t):''}</div>`}
function cardH(t){const c=cat(t.cat),sd=t.subs.filter(s=>s.done).length;return `<div class="kc" draggable="true" data-id="${t.id}">${esc(t.t)}<div class="mut"><span class="dot" style="background:${c.c}"></span>${esc(c.n)}${t.ref?`<span class="tag">${esc(t.ref)}</span>`:''}${t.due?`<span style="${od(t)?'color:var(--text-danger);font-weight:500':''}">${od(t)?'Late ':''}${fd(t.due).replace(/^\w+ /,'')}</span>`:''}${t.pri==='High'?'<span style="color:var(--text-warning)">High</span>':''}${t.subs.length?`<span>Sub ${sd}/${t.subs.length}</span>`:''}${t.own?`<span>${esc(t.own)}</span>`:''}</div></div>`}
function boardH(){const l=base().filter(scope);return `<div class="cols">${C.sts.map(s=>{const x=l.filter(t=>t.st===s.id);return `<div class="col" data-st="${s.id}"><h4><span>${esc(s.n)}</span><span>${x.length}</span></h4>${x.map(cardH).join('')}</div>`}).join('')}</div><p class="hint">Drag a card to another column to change its status.</p>`}
function archH(){return `<div class="card" style="padding:10px 14px;margin-top:12px"><div style="font-weight:500;margin-bottom:6px">Archived tasks</div>${ARCH.length?ARCH.slice().reverse().map(t=>`<div class="arow"><span style="flex:1">${esc(t.t)}</span><span class="mut">${esc(t.catName||cat(t.cat).n)}${t.at?' | '+esc(t.at):''}</span><button class="xs" data-a="rs" data-id="${t.id}">Restore</button></div>`).join(''):'<p class="mut" style="margin:0">Nothing archived yet. Finish a task, then use its Archive button.</p>'}</div>`}
function tasksV(){const l=vis(),b=base(),n=k=>b.filter(t=>{const s=TS;TS=k;const r=scope(t)&&(F.done||t.st!=='done');TS=s;return r}).length;
return `<input id="qa" type="text" placeholder="Spin & Win PRD fri p1 #gen wo:13370 @name" style="width:100%" autocomplete="off"><div class="pv" id="pv"></div><p class="hint">Press Enter to add. Optional: a date (today, tomorrow, fri, +3d, +2w), p1 to p3, #category, wo:number, @owner, due:2026-12-01.</p>
<div class="chips"><span style="display:flex;gap:4px">${[['today','Today'],['upcoming','Upcoming'],['all','All']].map(([k,nm])=>`<button class="sm ${TS===k?'on':''}" data-a="ts" data-id="${k}">${nm} ${n(k)}</button>`).join('')}</span><span style="width:8px"></span>${C.filters.map(f=>`<button class="chip fl ${F.flt===f.id?'on':''}" data-a="fl" data-id="${f.id}">${esc(f.n)} ${T.filter(t=>f.f(t)&&t.st!=='done').length}</button>`).join('')}<span style="flex:1"></span><span style="display:flex;gap:4px"><button class="sm ${LAY==='list'?'on':''}" data-a="lay" data-id="list">List</button><button class="sm ${LAY==='board'?'on':''}" data-a="lay" data-id="board">Board</button></span></div>
<div class="chips"><button class="chip ${F.cat==='all'?'on':''}" data-a="fc" data-id="all">All categories</button>${C.cats.map(c=>`<button class="chip ${F.cat===c.id?'on':''}" data-a="fc" data-id="${c.id}"><span class="dot" style="background:${c.c}"></span>${esc(c.n)}</button>`).join('')}<span style="flex:1"></span><input id="sq" type="text" placeholder="Search ( / )" value="${esc(F.q)}" style="width:130px;height:28px">${LAY==='list'?`<label class="mut" style="display:flex;align-items:center;gap:4px"><input type="checkbox" data-a="sd" ${F.done?'checked':''}>Show done</label>`:''}</div>
${C.team.length?`<div class="chips"><span class="mut">Team</span>${C.team.map(m=>`<button class="chip ${F.own===m?'on':''}" data-a="fo" data-id="${esc(m)}">${esc(m)}</button>`).join('')}</div>`:''}
${LAY==='list'?`<div class="card scroll">${l.length?l.map(rowH).join(''):`<p class="mut" style="padding:16px">${T.length?(TS==='today'?'Nothing due today and nothing in progress.':'No tasks match.')+' Clear a filter or add one above.':'Your board is empty. Add your first task above.'}</p>`}</div>`:boardH()}
<div style="margin-top:12px"><button class="sm" data-a="ao">Archive (${ARCH.length})</button></div>${ARCHOPEN?archH():''}
<p class="hint" style="margin-top:12px"><kbd>c</kbd> add <kbd>/</kbd> search <kbd>1</kbd> today <kbd>2</kbd> upcoming <kbd>3</kbd> all <kbd>b</kbd> list or board <kbd>r</kbd> report <kbd>Esc</kbd> leave a field</p>`}
function stats(){const o=T.filter(t=>t.st!=='done');return{open:o.length,late:T.filter(od).length,week:o.filter(t=>t.due&&t.due>=TODAY&&t.due<=addD(TODAY,7)).length,blk:T.filter(t=>t.st==='blocked').length,done:T.filter(t=>t.st==='done').length}}
function reportText(){const s=stats();let r=`${C.title} report, ${TODAY}\nOpen ${s.open} | Overdue ${s.late} | Due this week ${s.week} | Blocked ${s.blk} | Done ${s.done}\n`;C.sts.slice().reverse().forEach(x=>{const l=T.filter(t=>t.st===x.id);if(!l.length)return;r+=`\n${x.n} (${l.length})\n`;l.forEach(t=>{r+=`- ${t.t}${t.ref?' ['+t.ref+']':''}${t.own?' @'+t.own:''}${t.due?' (due '+t.due+')':''}${od(t)?' OVERDUE':''}\n`})});return r}
function reportV(){const s=stats(),mx=Math.max(1,...C.cats.map(c=>T.filter(t=>t.cat===c.id).length));return `<div class="grid"><div class="m"><span class="mut">Open</span><b>${s.open}</b></div><div class="m"><span class="mut">Overdue</span><b style="color:${s.late?'var(--text-danger)':'inherit'}">${s.late}</b></div><div class="m"><span class="mut">Due this week</span><b>${s.week}</b></div><div class="m"><span class="mut">Blocked</span><b>${s.blk}</b></div></div>
<div class="card" style="padding:12px 14px;margin-bottom:12px">${C.cats.map(c=>{const a=T.filter(t=>t.cat===c.id),d=a.filter(t=>t.st==='done').length;return `<div style="display:grid;grid-template-columns:130px 1fr 80px;gap:10px;align-items:center;margin:6px 0"><span style="font-size:13px"><span class="dot" style="background:${c.c}"></span> ${esc(c.n)}</span><div class="bar"><i style="width:${a.length/mx*100}%;background:${c.c}"></i></div><span class="mut">${d} of ${a.length} done</span></div>`}).join('')}</div>
<div style="display:flex;gap:8px;align-items:center"><button data-a="cp">Copy report</button><button data-a="csv">Export CSV</button><span class="mut" id="msg"></span></div><pre id="rt">${esc(reportText())}</pre>`}
function csvText(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=[['Title','Category','Status','Priority','Due','Work order','Owner','Note']].concat(T.map(t=>[t.t,cat(t.cat).n,(C.sts.find(s=>s.id===t.st)||{n:t.st}).n,t.pri,t.due,t.ref,t.own,t.note]));return rows.map(r=>r.map(q).join(',')).join('\n')}
function dl(name,text,type){try{const u=URL.createObjectURL(new Blob([text],{type:type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){return false}}
function setV(){return `<p class="mut" style="margin:0 0 10px">Everything here is also defined in the config block at the top of the file, so you can edit it as plain text.</p>
<div class="card" style="padding:12px 14px;margin-bottom:12px"><div style="font-weight:500;margin-bottom:8px">Categories</div>${C.cats.map((c,i)=>`<div class="set"><span class="dot" style="background:${c.c};width:14px;height:14px"></span><input type="text" value="${esc(c.n)}" data-a="rn" data-i="${i}"><select data-a="cc" data-i="${i}">${Object.entries(COLORS).map(([k,v])=>`<option value="${v}" ${v===c.c?'selected':''}>${k}</option>`).join('')}</select></div>`).join('')}<div class="set" style="grid-template-columns:1fr auto"><input type="text" id="nc" placeholder="New category name"><button data-a="ac">Add category</button></div></div>
<div class="card" style="padding:12px 14px;margin-bottom:12px"><div style="font-weight:500;margin-bottom:8px">Team</div>${C.team.map((m,i)=>`<div class="set" style="grid-template-columns:1fr auto"><span>${esc(m)}</span><button class="xs" data-a="tr" data-i="${i}">Remove</button></div>`).join('')}<div class="set" style="grid-template-columns:1fr auto"><input type="text" id="nt" placeholder="Add a team member"><button data-a="ta">Add</button></div></div>
<div class="card" style="padding:12px 14px;margin-bottom:12px"><div style="font-weight:500;margin-bottom:8px">Columns</div><div style="display:flex;gap:16px;flex-wrap:wrap">${[['ref','Work order'],['own','Owner'],['due','Due date'],['pri','Priority']].map(([k,n])=>`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-a="col" data-id="${k}" ${C.cols[k]?'checked':''}>${n}</label>`).join('')}</div></div>
<div class="card" style="padding:12px 14px;margin-bottom:12px"><div style="font-weight:500;margin-bottom:8px">Statuses</div>${C.sts.map((s,i)=>`<div class="set" style="grid-template-columns:1fr"><input type="text" value="${esc(s.n)}" data-a="sn" data-i="${i}"></div>`).join('')}<p class="hint">The last status counts as done.</p></div>
<div class="card" style="padding:12px 14px;margin-bottom:12px"><div style="font-weight:500;margin-bottom:8px">Backup</div><p class="mut" style="margin:0 0 8px">Your board saves automatically (${MODE==='db'?'in your claude.ai account':MODE==='local'?'in this browser only':'not saving right now'}). To move it between places, download a backup here and import it there. Old Signal Board backups import too.</p><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button data-a="bd">Download backup</button><button data-a="bpick">Import backup file</button><button data-a="bf">Show backup text</button><button data-a="bi">Import from text box</button><span class="mut" id="bmsg"></span></div><textarea id="imp" rows="4" placeholder="Backup text appears here, or paste one to import" style="width:100%;margin-top:8px;font-family:var(--font-mono);font-size:12px;background:var(--surface-2);color:var(--text-primary);border:.5px solid var(--border-strong);border-radius:var(--radius);padding:8px"></textarea></div>
<div class="card" style="padding:12px 14px"><div style="font-weight:500;margin-bottom:8px">Saved filters</div><p class="mut" style="margin:0 0 8px">Each filter is one line in the config. Example:</p><pre>{id:'wo', n:'WO tasks', f: t => !!t.ref}\n{id:'mine', n:'Mine', f: t => t.own === 'John'}</pre><p class="hint">Current filters: ${C.filters.map(f=>esc(f.n)).join(', ')}.</p></div>`}
function draw(){const a=document.getElementById('app');a.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px;flex-wrap:wrap"><span style="font-size:20px;font-weight:500">${esc(C.title)}</span><span class="mut"><span id="sv">${esc(SV)}</span> &nbsp; ${fd(TODAY)}</span></div><div class="seg">${[['tasks','Tasks'],['report','Report'],['set','Customize']].map(([k,n])=>`<button class="${V===k?'on':''}" data-a="v" data-id="${k}">${n}</button>`).join('')}</div>${V==='tasks'?tasksV():V==='report'?reportV():setV()}`}
const A=document.getElementById('app'),$=id=>document.getElementById(id),find=id=>T.find(x=>x.id===id);
function importData(d){const m=$('bmsg');try{if(!applyData(d))throw 0;commit();$('bmsg')&&($('bmsg').textContent='Imported, board replaced')}catch(e){m&&(m.textContent='That is not a valid backup')}}
A.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,id=b.dataset.id,i=b.dataset.i;
if(a==='v'){V=id;draw()}else if(a==='fc'){F.cat=id;draw()}else if(a==='ts'){TS=id;draw()}else if(a==='lay'){LAY=id;draw()}
else if(a==='fl'){F.flt=F.flt===id?'':id;draw()}else if(a==='fo'){F.own=F.own===id?'':id;draw()}
else if(a==='sb'){OPEN[id]=!OPEN[id];draw();if(OPEN[id]){const x=document.querySelector('[data-a="sa"][data-id="'+id+'"]');x&&x.focus()}}
else if(a==='sx'){const t=find(id);t.subs=t.subs.filter(s=>s.id!==b.dataset.s);commit()}
else if(a==='pc'){const t=find(id),cy=['',...C.pris];t.pri=cy[(cy.indexOf(t.pri)+1)%cy.length];commit()}
else if(a==='del'){T=T.filter(t=>t.id!==id);commit()}
else if(a==='ar'){const k=T.findIndex(t=>t.id===id);if(k>=0){const t=T.splice(k,1)[0];t.at=TODAY;t.catName=cat(t.cat).n;ARCH.push(t)}commit()}
else if(a==='rs'){const k=ARCH.findIndex(t=>t.id===id);if(k>=0){const t=ARCH.splice(k,1)[0];delete t.at;delete t.catName;T.push(t)}commit()}
else if(a==='ao'){ARCHOPEN=!ARCHOPEN;draw()}
else if(a==='cp'){const m=$('msg');try{navigator.clipboard.writeText(reportText()).then(()=>m.textContent='Copied',()=>m.textContent='Select the text below and copy')}catch(x){m.textContent='Select the text below and copy'}}
else if(a==='csv'){const m=$('msg');if(MODE!=='db'&&dl('signal-board.csv',csvText(),'text/csv'))m.textContent='CSV downloaded';else{try{navigator.clipboard.writeText(csvText()).then(()=>m.textContent='CSV copied, paste it into a sheet',()=>m.textContent='Copy is blocked here')}catch(x){m.textContent='Copy is blocked here'}}}
else if(a==='ac'){const v=$('nc').value.trim();if(v){C.cats.push({id:'c'+uid(),n:v,c:'#888780'});commit()}}
else if(a==='ta'){const v=$('nt').value.trim();if(v&&!C.team.includes(v)){C.team.push(v);commit()}}
else if(a==='tr'){C.team.splice(+i,1);commit()}
else if(a==='bd'){const m=$('bmsg');if(MODE!=='db'&&dl('signal-board-backup.json',JSON.stringify(payload(),null,1),'application/json'))m.textContent='Backup downloaded';else{$('imp').value=JSON.stringify(payload(),null,1);m.textContent='Backup text is in the box below. Copy it and keep it safe'}}
else if(a==='bpick'){$('ifile').click()}
else if(a==='bf'){$('imp').value=JSON.stringify(payload(),null,1)}
else if(a==='bi'){try{importData(JSON.parse($('imp').value))}catch(x){$('bmsg').textContent='That is not a valid backup'}}});
$('ifile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{importData(JSON.parse(r.result))}catch(x){const m=$('bmsg');m&&(m.textContent='That is not a valid backup')}};r.readAsText(f);e.target.value=''});
A.addEventListener('change',e=>{const el=e.target,a=el.dataset.a,id=el.dataset.id,i=el.dataset.i;
if(a==='chk'){const t=find(id);t.st=el.checked?C.sts[C.sts.length-1].id:C.sts[0].id;commit()}
else if(a==='sc'){const s=find(id).subs.find(x=>x.id===el.dataset.s);if(s)s.done=el.checked;commit()}
else if(a==='st'){find(id).st=el.value;commit()}
else if(a==='ow'){find(id).own=el.value;commit()}
else if(a==='du'){find(id).due=el.value;commit()}
else if(a==='sd'){F.done=el.checked;draw()}
else if(a==='rn'){C.cats[i].n=el.value.trim()||C.cats[i].n;commit()}
else if(a==='cc'){C.cats[i].c=el.value;commit()}
else if(a==='sn'){C.sts[i].n=el.value.trim()||C.sts[i].n;commit()}
else if(a==='col'){C.cols[id]=el.checked;save()}});
A.addEventListener('focusout',e=>{const el=e.target;if(el.dataset&&el.dataset.a==='et'){const t=find(el.dataset.id),x=el.textContent.trim();if(t&&x&&x!==t.t){t.t=x;save()}else if(t&&!x)el.textContent=t.t}});
A.addEventListener('input',e=>{if(e.target.id==='sq'){F.q=e.target.value;const p=e.target.selectionStart;draw();const s=$('sq');s.focus();s.setSelectionRange(p,p)}
else if(e.target.id==='qa'){const pv=$('pv'),raw=e.target.value;if(!raw.trim()){pv.textContent='';return}const t=parseQ(raw);pv.textContent='Adds: '+(t.t||'(add a title)')+'  |  '+cat(t.cat).n+(t.pri?'  |  '+t.pri:'')+(t.due?'  |  due '+fd(t.due):'')+(t.ref?'  |  '+t.ref:'')+(t.own?'  |  @'+t.own:'')}});
A.addEventListener('keydown',e=>{const el=e.target;
if(el.id==='qa'&&e.key==='Enter'){const t=parseQ(el.value);if(!t.t)return;t.id=uid();T.unshift(t);commit();$('qa').focus()}
else if(el.dataset&&el.dataset.a==='sa'&&e.key==='Enter'){const v=el.value.trim(),t=find(el.dataset.id);if(!v||!t)return;t.subs.push({id:uid('s'),t:v,done:false});const id=t.id;commit();const x=document.querySelector('[data-a="sa"][data-id="'+id+'"]');x&&x.focus()}
else if(el.dataset&&el.dataset.a==='et'&&e.key==='Enter'){e.preventDefault();el.blur()}});
let dragId=null;
A.addEventListener('dragstart',e=>{const k=e.target.closest('.kc');if(k){dragId=k.dataset.id;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}});
A.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(c){e.preventDefault();c.classList.add('over')}});
A.addEventListener('dragleave',e=>{const c=e.target.closest('.col');if(c)c.classList.remove('over')});
A.addEventListener('drop',e=>{const c=e.target.closest('.col');if(c&&dragId!==null){e.preventDefault();find(dragId).st=c.dataset.st;dragId=null;commit()}});
document.addEventListener('keydown',e=>{const el=document.activeElement,typing=el&&(el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA'||el.isContentEditable);
if(e.key==='Escape'){if(typing)el.blur();return}
if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
const k=e.key;
if(k==='c'){e.preventDefault();V='tasks';draw();$('qa').focus()}
else if(k==='/'){e.preventDefault();V='tasks';draw();$('sq').focus()}
else if(k==='1'||k==='2'||k==='3'){V='tasks';TS=['today','upcoming','all'][+k-1];draw()}
else if(k==='b'){V='tasks';LAY=LAY==='list'?'board':'list';draw()}
else if(k==='r'){V=V==='report'?'tasks':'report';draw()}});
draw();init();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script></body></html>
